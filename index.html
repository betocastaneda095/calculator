<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="container">
        <section class="header">
            <h2>Beto's calculator</h2>
        </section>
        <section class="output">

        </section>

        <section class="keyboard">
            <section class="keycaps">
                <ul class="numbers">
                    <li><button class="number">7</button></li>
                    <li><button class="number">8</button></li>
                    <li><button class="number">9</button></li>
                </ul>
                <ul class="numbers">
                    <li><button class="number">4</button></li>
                    <li><button class="number">5</button></li>
                    <li><button class="number">6</button></li>
                </ul>
                <ul class="numbers">    
                    <li><button class="number">1</button></li>
                    <li><button class="number">2</button></li>
                    <li><button class="number">3</button></li>
                
                </ul>
                <ul class="numbers">    
                    <li><button class="number-last">0</button></li>
                    <li><button class="number-point">.</button></li>             
                </ul>

            </section>
            <section class="operators">
                <ul class="op">
                    <li><button class="operator">+</button></li>
                    <li><button class="operator">-</button></li>
                    <li><button class="operator">*</button></li>  
                    <li><button class="operator">/</button></li>  
                    <li><button class="operator">=</button></li>                      
                </ul>
            </section>
        </section>    
    </section>    
</body>
</html>

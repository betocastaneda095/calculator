<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section class="container">
        <section class="header">
            <h2>Beto's calculator</h2>
        </section>
    
        <input id="display" type="text" name="input" placeholder="Enter operators">
     

        <section class="keyboard">
            <section class="keycaps">
                <ul class="delete">
                    <li><button id="ac" class="operator">A/C</button></li>
                    <li><button id="del" class="operator">DEL</button></li>
                </ul>
                <ul class="numbers">
                    <li><button id="seven" class="number">7</button></li>
                    <li><button id="eight" class="number">8</button></li>
                    <li><button id="nine"  class="number">9</button></li>
                </ul>
                <ul class="numbers">
                    <li><button id="four" class="number">4</button></li>
                    <li><button id="five" class="number">5</button></li>
                    <li><button id="six" class="number">6</button></li>
                </ul>
                <ul class="numbers">    
                    <li><button id="one" class="number">1</button></li>
                    <li><button id="two" class="number">2</button></li>
                    <li><button id="three" class="number">3</button></li>
                
                </ul>
                <ul class="numbers">    
                    <li><button data-value=0 id="zero" class="number">0</button></li>
                    <li><button data-value="." id="dot" class="number-point">.</button></li>             
                </ul>

            </section>
            <section class="operators">
                <ul class="op">
                    <li><button data-value="-" id="minus" class="operator">-</button></li>
                    <li><button data-value="*" id="mult" class="operator">*</button></li>  
                    <li><button data-value="+" id="plus" class="operator">+</button></li>
                    <li><button data-value="/" id="division" class="operator">/</button></li>  
                    <li><button data-value="=" id="equal" class="operator">=</button></li>                      
                </ul>
            </section>
        </section>    
    </section>    
    <script src="js/script.js" defer></script>
</body>
</html>
